name: Build debug APK

# Phase 1 goal: prove the UNMODIFIED Telegram-Android source compiles and produces
# an installable APK. No app code is changed by this workflow; the only edit it makes
# is injecting the API credentials at build time (never committed).

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Build with the API credentials already present in the source (no secrets needed). Verifies the toolchain only.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned upstream commit this project is built against (see PROGRESS.md).
  TELEGRAM_COMMIT: 21f7d109da6ab3506c9e9577f98c6a38771ab335
  GRADLE_TASK: ':TMessagesProj_App:assembleAfatDebug'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show pinned commit
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          echo "Expected pin:    ${TELEGRAM_COMMIT}"
          echo "Version:         $(grep '^APP_VERSION_NAME' gradle.properties)"

      - name: Verify app source is unmodified vs pinned upstream commit
        run: |
          if ! git cat-file -e "${TELEGRAM_COMMIT}^{commit}" 2>/dev/null; then
            # Shallow clone may not contain the pinned commit object itself.
            git fetch --depth=1 origin "${TELEGRAM_COMMIT}"
          fi
          CHANGED="$(git diff --name-only "${TELEGRAM_COMMIT}" -- . \
            ':(exclude).github' \
            ':(exclude)TMessagesProj/src/main/java/org/telegram/ui/VoIPFragment.java' \
            ':(exclude)TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java' \
            ':(exclude)TMessagesProj/src/main/java/org/telegram/messenger/translation')"
          if [ -n "$CHANGED" ]; then
            echo "::error::App source differs from pinned commit ${TELEGRAM_COMMIT}:"
            echo "$CHANGED"
            exit 1
          fi
          echo "OK: source changes are limited to the mic spike and build-time config."

      - name: Check secrets are present
        if: ${{ inputs.smoke_test != true }}
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APP_SECRET: ${{ secrets.APP_SHARED_SECRET }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ] || [ -z "$APP_SECRET" ]; then
            echo "::error::Missing repository secrets TELEGRAM_API_ID, TELEGRAM_API_HASH, and/or APP_SHARED_SECRET."
            echo "Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secrets are present. Values are not printed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages, NDK and CMake
        run: |
          # ubuntu-latest runners ship the Android SDK + sdkmanager already.
          # (android-actions/setup-android@v3 breaks here: it still asks for the
          # removed "tools" package and exits 1 with cmdline-tools 16.0.)
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -path '*/cmdline-tools/*/bin/sdkmanager' | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "--- installed ---"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" 2>/dev/null || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmake" 2>/dev/null || true

      - name: Show disk space
        run: df -h / /home/runner 2>/dev/null || df -h /

      - name: Set up Gradle (with dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Restores/saves ~/.gradle/caches (dependencies, wrapper, build cache)
          # and enables Gradle's build cache for faster rebuilds.
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Smoke test notice
        if: ${{ inputs.smoke_test == true }}
        run: |
          echo "::warning::SMOKE TEST run: secrets not required; this build uses the API credentials already present in the source. Do not distribute this APK."

      - name: Inject API credentials at build time
        if: ${{ inputs.smoke_test != true }}
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APP_SECRET: ${{ secrets.APP_SHARED_SECRET }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/(public static int APP_ID = )[^;]+;/\1${API_ID};/" "$F"
          sed -i -E "s/(public static String APP_HASH = \")[^\"]*\";/\1${API_HASH}\";/" "$F"
          sed -i -E "s/(public static String APP_SHARED_SECRET = \")[^\"]*\";/\1${APP_SECRET}\";/" "$F"
          # Verify without printing the values (the file would echo the secrets).
          if ! grep -qE "public static int APP_ID = ${API_ID};" "$F"; then
            echo "::error::APP_ID injection failed"; exit 1
          fi
          if ! grep -qF "${API_HASH}" "$F"; then
            echo "::error::APP_HASH injection failed"; exit 1
          fi
          if ! grep -qF "APP_SHARED_SECRET = \"${APP_SECRET}\"" "$F"; then
            echo "::error::APP_SHARED_SECRET injection failed"; exit 1
          fi
          echo "Credentials injected into the working tree only (never committed, not printed)."

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew ${GRADLE_TASK} --build-cache --stacktrace --no-daemon

      - name: List APK outputs
        if: always()
        run: |
          find TMessagesProj_App/build/outputs -name '*.apk' -printf '%p  %s bytes\n' 2>/dev/null || echo "no APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          # This APK embeds the API credentials and the fork is public: keep the
          # artifact only 1 day. Download it, then delete the run/artifact.
          retention-days: 1
          compression-level: 0
